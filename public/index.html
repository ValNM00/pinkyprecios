<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PinkyPrecios</title>
<meta name="description" content="Compará precios de electrónica y electrodomésticos entre tiendas de Costa Rica.">
<meta name="theme-color" content="#c8386d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500..700,100,0..1;1,9..144,400..600,100,0..1&family=Nunito:wght@400;500;600;700;800;900&display=swap">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="#" data-action="inicio" aria-label="Ir al inicio" id="logo"></a>
    <form class="search" id="form-top" role="search">
      <label class="sr-only" for="q">Buscar productos</label>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscá un producto, por ejemplo “freidora de aire”" autocomplete="off" enterkeyhint="search">
    </form>
    <nav class="top-actions" aria-label="Herramientas">
      <div class="moneda" role="group" aria-label="Moneda">
        <button type="button" data-action="moneda" data-m="CRC" id="m-crc">₡</button>
        <button type="button" data-action="moneda" data-m="USD" id="m-usd">US$</button>
      </div>
      <button type="button" class="pill-btn icon-btn solo-ancho" data-action="tema" id="btn-tema" aria-label="Cambiar tema"></button>
      <button type="button" class="pill-btn" data-action="panel" data-p="tiendas" aria-label="Ranking de tiendas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.5-5h-13zM5 10v9h14v-9M10 19v-5h4v5"/></svg><span class="lbl">Tiendas</span></button>
      <button type="button" class="pill-btn" data-action="panel" data-p="alertas" aria-label="Alertas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="lbl">Alertas</span> <span class="count" id="n-alertas">0</span></button>
      <button type="button" class="pill-btn" data-action="panel" data-p="lista" aria-label="Mi lista"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="lbl">Mi lista</span> <span class="count" id="n-lista">0</span></button>
    </nav>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite">
  <p class="cargando">Cargando precios…</p>
</main>

<div class="tray" id="tray" hidden></div>

<div class="overlay" id="overlay" hidden data-action="cerrar"></div>
<aside class="panel" id="panel" hidden aria-modal="true" role="dialog" aria-labelledby="panel-title"></aside>

<div class="toast" id="toast" role="status" hidden></div>

<footer class="wrap pie">
  <p id="pie-fuente"></p>
  <p>Precios tomados de los sitios públicos de cada tienda. Pueden cambiar en cualquier momento: confirmá en la tienda antes de comprar. PinkyPrecios no está afiliado a ninguna tienda.</p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
