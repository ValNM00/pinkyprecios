<style>
  :root { --bg: #fff8fb; --surface: #ffffff; --ink: #4f2238; --muted: #8a5f73; --line: #f2dfe8; --accent: #b9406f; --accent-ink: #fff; --soft: #fdecf3; --rose: #dd97b2; --tag: #ffcadd; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1219; --surface: #261920; --ink: #f8e8ef; --muted: #c2a0b1; --line: #3d2a35; --accent: #f08bb0; --accent-ink: #2a0f1c; --soft: #3d2231; --rose: #e3a0ba; --tag: #f6a9c6; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 80% 10%, var(--soft), transparent 45%), radial-gradient(circle at 10% 90%, var(--soft), transparent 40%), var(--bg); color: var(--ink); font: 600 16px/1.5 'Nunito', system-ui, sans-serif; text-align: center; }
  main { width: 100%; max-width: 520px; display: grid; gap: 14px; justify-items: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font: 600 26px 'Fraunces', Georgia, serif; }
  .logo img { width: 46px; height: 46px; }
  .logo i { color: var(--accent); }
  svg { width: min(240px, 70vw); height: auto; }
  .f { fill: var(--soft); } .b { fill: var(--surface); stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
  .l { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; } .c { fill: var(--rose); } .s { fill: var(--tag); }
  h1 { font: 600 clamp(30px, 6vw, 44px)/1.1 'Fraunces', Georgia, serif; margin: 0; letter-spacing: -.03em; }
  h1 em { color: var(--accent); font-weight: 500; }
  p { margin: 0; color: var(--muted); }
  .acc { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
  a.btn { text-decoration: none; border-radius: 999px; padding: 12px 22px; font-weight: 800; border: 1.5px solid var(--line); color: var(--ink); background: var(--surface); }
  a.btn.p { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  form { display: flex; gap: 8px; width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 18px; }
  form:focus-within { border-color: var(--accent); }
  input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: inherit; outline: none; }
  button { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 800 15px 'Nunito', sans-serif; padding: 10px 18px; cursor: pointer; }
  small { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) { svg { animation: flotar 3.6s ease-in-out infinite; } @keyframes flotar { 50% { transform: translateY(-8px); } } }
</style>
